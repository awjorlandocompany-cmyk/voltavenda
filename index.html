<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoltaVenda | Gestão de Orçamentos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d0b;color:#edf5ef;font-family:Arial,sans-serif}
main{max-width:1050px;margin:35px auto;padding:20px}
h1{color:#35e58a;margin-bottom:5px}
.sub{color:#9aada1}
.card{background:#111b16;border:1px solid #26382d;border-radius:14px;padding:20px;margin:18px 0}
input,select{width:100%;padding:13px;margin:7px 0 12px;background:#08110c;color:white;border:1px solid #344b3b;border-radius:8px}
button{padding:12px 17px;border:0;border-radius:8px;background:#28d77c;color:#06130a;font-weight:bold;cursor:pointer;margin:4px}
button.secondary{background:#26382d;color:white}
button.danger{background:#793b3b;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.metric{background:#0b140e;padding:18px;border-radius:10px}
.metric strong{display:block;font-size:25px;color:#35e58a;margin-top:8px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #293a2e}
.table-wrap{overflow-x:auto}
.hidden{display:none}
#message{color:#35e58a;min-height:22px}
small{color:#a7b7ac}
</style>
</head>
<body>
<main>
  <h1>VoltaVenda</h1>
  <div class="sub">Recupere orçamentos e venda mais serviços.</div>

  <section id="auth" class="card">
    <h2>Acesse sua oficina</h2>
    <label>Nome da oficina (somente para cadastro)</label>
    <input id="business" placeholder="Nome da oficina">
    <label>E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com">
    <label>Senha</label>
    <input id="password" type="password" placeholder="Mínimo de 6 caracteres">
    <button onclick="signup()">Criar conta</button>
    <button class="secondary" onclick="login()">Entrar</button>
    <p id="message"></p>
    <small>No primeiro cadastro, confirme seu e-mail se o Supabase solicitar.</small>
  </section>

  <section id="app" class="hidden">
    <div class="row">
      <span id="welcome"></span>
      <button class="secondary" onclick="logout()">Sair</button>
    </div>

    <section class="grid">
      <div class="metric">Orçamentos<strong id="total">0</strong></div>
      <div class="metric">Pendentes<strong id="pending">0</strong></div>
      <div class="metric">Recuperados<strong id="recovered">0</strong></div>
      <div class="metric">Valor recuperado<strong id="amount">R$ 0,00</strong></div>
    </section>

    <section class="card">
      <h2>Novo orçamento</h2>
      <input id="customer" placeholder="Nome do cliente">
      <input id="phone" placeholder="WhatsApp com DDD (ex.: 11999999999)">
      <input id="service" placeholder="Serviço (ex.: troca de óleo)">
      <input id="value" type="number" min="0" step="0.01" placeholder="Valor do orçamento em R$">
      <button onclick="addQuote()">Salvar orçamento</button>
      <p id="appmessage"></p>
    </section>

    <section class="card">
      <h2>Orçamentos cadastrados</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="quotes"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>

<script>
const SUPABASE_URL = "https://phxguikugvfengatatqw.supabase.co";
const SUPABASE_KEY = "sb_publishable_BEvxfPpJNm-GyODaKiZf4w_Ul6WVzji";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let records = [];

function msg(id,text){document.getElementById(id).textContent=text;}

async function signup(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const business=document.getElementById("business").value.trim() || "Minha oficina";
  if(!email || password.length<6){msg("message","Informe e-mail e senha com pelo menos 6 caracteres.");return;}
  msg("message","Criando conta...");
  const {data,error}=await db.auth.signUp({
    email,password,
    options:{data:{business_name:business}}
  });
  if(error){msg("message",error.message);return;}
  if(data.session){await startApp(data.session.user);}
  else{msg("message","Conta criada! Confira seu e-mail para confirmar o cadastro e depois entre.");}
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  msg("message","Entrando...");
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){msg("message",error.message);return;}
  await startApp(data.user);
}

async function logout(){
  await db.auth.signOut();
  currentUser=null;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");
}

async function startApp(user){
  currentUser=user;
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("welcome").textContent="Oficina: "+(user.user_metadata.business_name || user.email);
  await loadQuotes();
}

async function loadQuotes(){
  const {data,error}=await db.from("quotes").select("*").order("created_at",{ascending:false});
  if(error){msg("appmessage","Erro ao carregar: "+error.message);return;}
  records=data || [];
  render();
}

async function addQuote(){
  const customer_name=document.getElementById("customer").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const service=document.getElementById("service").value.trim();
  const amount=Number(document.getElementById("value").value);
  if(!customer_name || !phone || !service || !Number.isFinite(amount) || amount<0){
    msg("appmessage","Preencha todos os campos corretamente.");return;
  }
  msg("appmessage","Salvando...");
  const {error}=await db.from("quotes").insert({
    workshop_id:currentUser.id,customer_name,phone,service,amount,status:"Pendente"
  });
  if(error){msg("appmessage","Erro ao salvar: "+error.message);return;}
  ["customer","phone","service","value"].forEach(id=>document.getElementById(id).value="");
  msg("appmessage","Orçamento salvo na nuvem!");
  await loadQuotes();
}

async function changeStatus(id,status){
  const {error}=await db.from("quotes").update({status}).eq("id",id);
  if(error){msg("appmessage","Erro ao atualizar: "+error.message);return;}
  await loadQuotes();
}

async function removeQuote(id){
  if(!confirm("Deseja excluir este orçamento?"))return;
  const {error}=await db.from("quotes").delete().eq("id",id);
  if(error){msg("appmessage","Erro ao excluir: "+error.message);return;}
  await loadQuotes();
}

function render(){
  const pending=records.filter(x=>x.status==="Pendente").length;
  const recovered=records.filter(x=>x.status==="Recuperado");
  document.getElementById("total").textContent=records.length;
  document.getElementById("pending").textContent=pending;
  document.getElementById("recovered").textContent=recovered.length;
  document.getElementById("amount").textContent=recovered.reduce((s,x)=>s+Number(x.amount),0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  document.getElementById("quotes").innerHTML=records.map(x=>`
    <tr>
      <td>${escapeHTML(x.customer_name)}<br><small>${escapeHTML(x.phone)}</small></td>
      <td>${escapeHTML(x.service)}</td>
      <td>${Number(x.amount).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>
      <td>${escapeHTML(x.status)}</td>
      <td>
        <button onclick="whatsapp('${encodeURIComponent(x.phone)}','${encodeURIComponent(x.customer_name)}','${encodeURIComponent(x.service)}')">WhatsApp</button>
        <button class="secondary" onclick="changeStatus('${x.id}','${x.status==="Recuperado"?"Pendente":"Recuperado"}')">${x.status==="Recuperado"?"Voltar":"Recuperado"}</button>
        <button class="danger" onclick="removeQuote('${x.id}')">Excluir</button>
      </td>
    </tr>`).join("");
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function whatsapp(phone,name,service){
  const p=decodeURIComponent(phone).replace(/\D/g,"");
  const n=decodeURIComponent(name);
  const s=decodeURIComponent(service);
  const number=p.startsWith("55")?p:"55"+p;
  const message=encodeURIComponent(`Olá, ${n}! Tudo bem? Estamos passando para saber se deseja seguir com o orçamento de ${s}. Podemos ajudar?`);
  window.open(`https://wa.me/${number}?text=${message}`,"_blank");
}

db.auth.getSession().then(({data})=>{
  if(data.session)startApp(data.session.user);
});
</script>
</body>
</html>
